<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Doski Café — Menu</title>
<!-- Preload critical assets -->
<link rel="preload" href="logo.png" as="image">
<!-- Fonts: preconnect + display=swap to avoid render-blocking -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">

</head>
<body>

<!-- Atmospheric background -->
<div class="atmo-bg" aria-hidden="true">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="vignette"></div>
</div>

<!-- Intro splash -->
<section class="intro" id="intro">
  <div class="intro-logo-wrap">
    <img
      src="logo.png"
      alt="Doski Café — Mood Served"
      class="intro-logo"
      draggable="false"
      decoding="async"
      fetchpriority="high"
    >
  </div>
  <button class="enter" id="enterBtn">Open the menu</button>
</section>

<!-- Discount Banner -->
<div class="discount-banner hidden" id="discountBanner" aria-live="polite">
  <div class="discount-banner__shimmer"></div>
  <div class="discount-banner__track">
    <!-- repeated for seamless loop -->
    <span class="discount-banner__msg">
      <span class="discount-badge">🎉</span>
      خصم <strong>20%</strong> على جميع منتجاتنا
      <span class="discount-divider">✦</span>
      لا تفوّت الفرصة — العرض لفترة محدودة!
      <span class="discount-divider">✦</span>
      خصم <strong>20%</strong> على جميع منتجاتنا
      <span class="discount-divider">✦</span>
      استمتع بأفضل العروض معنا
      <span class="discount-badge">🎉</span>
    </span>
    <span class="discount-banner__msg" aria-hidden="true">
      <span class="discount-badge">🎉</span>
      خصم <strong>20%</strong> على جميع منتجاتنا
      <span class="discount-divider">✦</span>
      لا تفوّت الفرصة — العرض لفترة محدودة!
      <span class="discount-divider">✦</span>
      خصم <strong>20%</strong> على جميع منتجاتنا
      <span class="discount-divider">✦</span>
      استمتع بأفضل العروض معنا
      <span class="discount-badge">🎉</span>
    </span>
  </div>
</div>

<!-- Main app -->
<main class="app hidden" id="app">
  <header class="top">
    <button class="back hidden" id="backBtn" aria-label="Back">‹ Back</button>
    <div class="brand-logo-wrap">
      <img
        src="logo.png"
        alt="Doski Café"
        class="brand-logo"
        draggable="false"
        decoding="async"
      >
    </div>
  </header>

  <!-- Categories -->
  <section id="categories" class="grid"></section>

  <!-- Products -->
  <section id="products" class="hidden">
    <h3 class="cat-title" id="catTitle"></h3>
    <div class="grid products-grid" id="productsGrid"></div>
  </section>
</main>
