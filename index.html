<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doski Café — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Atmospheric background -->
<div class="atmo-bg" aria-hidden="true">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="vignette"></div>
</div>

<!-- Intro splash -->
<section class="intro" id="intro">
  <div class="intro-logo-wrap">
    <img
      src="logo.png"
      alt="Doski Café — Mood Served"
      class="intro-logo"
      draggable="false"
    >
  </div>
  <button class="enter" id="enterBtn">Open the menu</button>
</section>

<!-- Main app -->
<main class="app hidden" id="app">
  <header class="top">
    <button class="back hidden" id="backBtn" aria-label="Back">‹ Back</button>
    <div class="brand-logo-wrap">
      <img
        src="logo.png"
        alt="Doski Café"
        class="brand-logo"
        draggable="false"
      >
    </div>
  </header>

  <!-- Categories -->
  <section id="categories" class="grid"></section>

  <!-- Products -->
  <section id="products" class="hidden">
    <h3 class="cat-title" id="catTitle"></h3>
    <div class="grid products-grid" id="productsGrid"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
